<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MGI Insight · Job & JD Library</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F8F6;color:#0B3A24;font:14px/1.5 "Segoe UI",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mast{background:linear-gradient(180deg,#0B3A24,#124A2F);color:#fff;padding:16px 24px 0}
.mast .brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8FC4AB;font-weight:600}
.mast h1{margin:6px 0 2px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.mast .sub{font-size:12.5px;color:#A8D6C0;padding-bottom:14px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.07);color:#C9EADA;border:none;padding:10px 16px;font:600 12.5px/1 "Segoe UI",sans-serif;letter-spacing:.02em;cursor:pointer;border-radius:6px 6px 0 0}
.tab:hover{background:rgba(255,255,255,.14);color:#fff}
.tab.on{background:#F4F8F6;color:#0B3A24}
.wrap{padding:18px 24px 60px;max-width:1500px}
.card{background:#fff;border:1px solid #DFECE6;border-radius:8px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,58,36,.04)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5f7characters}
.fld label{color:#5F9079}
input,select{font:13px "Segoe UI",sans-serif;padding:8px 10px;border:1px solid #CFE3D9;border-radius:6px;background:#fff;color:#0B3A24;min-width:150px}
input:focus,select:focus{outline:none;border-color:#25EB8F;box-shadow:0 0 0 3px rgba(37,235,143,.12)}
input.srch{min-width:300px}
.cnt{font-size:12.5px;color:#5F9079;margin-left:auto;white-space:nowrap}
.cnt b{color:#0B3A24;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.tblwrap{overflow:auto;max-height:520px;border:1px solid #E5F0EB;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#EEF7F3;text-align:left;padding:9px 11px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F9079;border-bottom:1px solid #D7E8E0;white-space:nowrap;z-index:1}
td{padding:8px 11px;border-bottom:1px solid #EEF6F2;vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:#F5FFFA}
tr.row.sel td{background:#E8FEF4}
.mono{font-family:Consolas,"SF Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:3px;background:#EEF7F3;color:#3C7359;white-space:nowrap}
.pill.e{background:#E7F7F1;color:#3D8E70}.pill.m{background:#E4F9EF;color:#1CA864}
.pill.p{background:#E2F2ED;color:#157A63}.pill.s{background:#FAEEDD;color:#8A5A14}
.det{position:sticky;top:14px}
.det h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.det .meta{font-size:12.5px;color:#5F9079;margin-bottom:12px}
.det .body{font-size:13.5px;line-height:1.62;white-space:pre-wrap;max-height:470px;overflow:auto;padding-right:6px}
.det .body h4{margin:14px 0 4px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#5F9079}
.empty{color:#84AB98;font-size:13px;padding:30px 10px;text-align:center;border:1.5px dashed #D3E7DD;border-radius:6px}
.note{font-size:11.5px;color:#72A08A;margin-top:10px;line-height:1.5}
.note b{color:#3C7359}
.dash{color:#B3CFC2}
.prov{background:#FAFEFC;border:1px solid #E5F0EB;border-radius:6px;padding:10px 12px;font-size:11.5px;color:#5F9079;line-height:1.55}
.view{display:none}.view.on{display:block}
.bar{height:5px;border-radius:3px;background:#157A63;display:inline-block;vertical-align:middle;margin-right:6px}

/* ---- JD document: mirrors the approved Word layout ---- */
.jddoc{background:#fff;max-width:816px;margin:0 auto;padding:36px;border:1px solid #DFECE6;border-radius:4px;
  box-shadow:0 2px 8px rgba(11,58,36,.07);font-family:Arial,Helvetica,sans-serif;font-size:10pt;line-height:1.42;color:#1a1a1a}
.jddoc .jdttl{font-weight:700;font-size:10pt;margin-bottom:10px}
.jddoc table{border-collapse:collapse;width:100%;margin-bottom:10px;font-size:10pt}
.jddoc td{border:1px solid #7f7f7f;padding:4px 7px;vertical-align:top}
.jddoc td.lbl{font-weight:700;width:15%;white-space:nowrap}
.jddoc td.val{width:35%}
.jddoc td.hd{font-weight:700;background:#f2f2f2}
.jddoc ul{margin:0;padding-left:20px}
.jddoc li{margin-bottom:3px}
.jddoc p{margin:0 0 8px}
.jddoc p:last-child{margin-bottom:0}
@media print{
  body{background:#fff}
  .mast,.noprint,.tabs{display:none !important}
  .wrap{padding:0;max-width:none}
  .jddoc{border:none;box-shadow:none;border-radius:0;margin:0;padding:0;max-width:none}
  @page{size:letter;margin:0.5in}
}
</style>
<style id="mobileFit">@media (max-width:700px){ html,body{min-width:0!important;overflow-x:hidden} table{display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch} img,svg,canvas,video{max-width:100%} .card,.note,.det,.empty,.pad{max-width:100%!important;width:auto!important;box-sizing:border-box} } @media (max-width:700px){ .split{grid-template-columns:minmax(0,1fr)!important} .split>*{min-width:0} }</style>

y":"Learns the craft by doing the standard tasks with a guide nearby","complexity":"Works on problems of limited to moderate scope. Applies established methods and professional judgement to analyse the situation and find a workable answer.","experienceRequired":"Works from objectives rather than step-by-step instructions. Plans own work, checks it against the standard and escalates only the issues that fall outside established practice.","experienceTypical":"Bachelor degree or equivalent experience preferred. Typically 0 to 2 years of experience in the field."},{"category":"Support","grade":"S4","radford":"S4","radfordAdj":null,"ipas":"A4","ipasAdj":null,"levelDescription":"Senior Support","analogy":"Knows the routine so well that new colleagues learn it from them","complexity":"Works on routine, well-defined tasks. Follows set procedures and standard practice and refers anything unusual to a supervisor.","experienceRequired":"Works from clear instructions and a daily plan. Is checked against quality, safety and output standards and receives training on the job.","experienceTypical":"Secondary school diploma or equivalent. Typically 4 or more years of experience in the role and any licences the work requires."},{"category":"Support","grade":"S3","radford":"S3","radfordAdj":null,"ipas":"A3","ipasAdj":null,"levelDescription":"Support II","analogy":"Carries out the routine without supervision and spots when it is off","complexity":"Works on routine, well-defined tasks. Follows set procedures and standard practice and refers anything unusual to a supervisor.","experienceRequired":"Works from clear instructions and a daily plan. Is checked against quality, safety and output standards and receives training on the job.","experienceTypical":"Secondary school diploma or equivalent. Typically 2 to 4 years of experience in the role."},{"category":"Support","grade":"S2","radford":"S2","radfordAdj":null,"ipas":"A2","ipasAdj":null,"levelDescription":"Support I","analogy":"Does th <script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('DATA').textContent);

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dash(){ return '<span class="dash">&ndash;</span>'; }
/* Category order per house rule: Executive, Management, Professional, Support; everything else A-Z */
var CATORD = {'executive':0,'management':1,'professional':2,'support':3};
function catSort(a,b){
  var x=CATORD[String(a).toLowerCase()], y=CATORD[String(b).toLowerCase()];
  if(x!=null&&y!=null) return x-y;
  if(x!=null) return -1;
  if(y!=null) return 1;
  return String(a).localeCompare(String(b));
}
/* Every filter gets an All option; All bypasses the filter INCLUDING blank/unassigned */
function fill(sel,vals,allLabel,sorter){
  var u={}, out=[];
  vals.forEach(function(v){ var k=(v==null?'':String(v)).trim(); if(k!==''&&!u[k]){u[k]=1;out.push(k);} });
  out.sort(sorter||function(a,b){ return a.localeCompare(b); });
  sel.innerHTML = '<option value="__all">'+allLabel+'</option>' +
    out.map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('');
}
function pass(filterVal,rowVal){ return filterVal==='__all' ? true : String(rowVal||'').trim()===filterVal; }
function famPill(lv){
  var s=String(lv||''), c='';
  if(/Executive/i.test(s)) c='e';
  else if(/Supervisor|Manager|Director/i.test(s)) c='m';
  else if(/Entry \(P|Developing|Career|Advanced|Expert|Principal \(P|Distinguished/i.test(s)) c='p';
  else if(/Entry \(S|Intermediate|Senior \(S|Highly Skilled|Specialist/i.test(s)) c='s';
  return '<span class="pill '+c+'">'+esc(s||'-')+'</span>';
}
var MAXROWS = 400;

/* ---------- tabs ---------- */
var tabs=[].slice.call(document.querySelectorAll('.tab'));
tabs.forEach(function(t){
  t.onclick=function(){
    tabs.forEach(function(x){ x.classList.remove('on'); });
    t.classList.add('on');
    [].slice.call(document.querySelectorAll('.view')).forEach(function(v){ v.classList.remove('on'); });
    $('v-'+t.getAttribute('data-v')).classList.add('on');
  };
});

/* ================= MARKET JOBS ================= */
var MJ = D.radford.jobs, DEFS = D.definitions, MAPPED = {};
(D.mapping||[]).forEach(function(m){ if(m.radfordCode) MAPPED[m.radfordCode]=1; });
function isMapped(code){
  for(var k in MAPPED){ if(code.indexOf(k)===0) return true; }
  return false;
}
var MAPCACHE={};
function mappedCached(code){
  if(MAPCACHE[code]===undefined) MAPCACHE[code]=isMapped(code);
  return MAPCACHE[code];
}
fill($('mFn'), MJ.map(function(j){return j['function'];}), 'All functions');
fill($('mLv'), MJ.map(function(j){return j.level;}), 'All levels');
function mRender(){
  var q=$('mSrch').value.trim().toLowerCase(), fn=$('mFn').value, lv=$('mLv').value, mp=$('mMap').value;
  var out=[], total=0;
  for(var i=0;i<MJ.length;i++){
    var j=MJ[i];
    if(!pass(fn,j['function'])) continue;
    if(!pass(lv,j.level)) continue;
    if(q && (String(j.title||'').toLowerCase().indexOf(q)<0 && String(j.code||'').toLowerCase().indexOf(q)<0 && String(j.area||'').toLowerCase().indexOf(q)<0)) continue;
    if(mp!=='all'){ var m=mappedCached(j.code); if(mp==='yes'&&!m) continue; if(mp==='no'&&m) continue; }
    total++;
    if(out.length<MAXROWS) out.push(j);
  }
  $('mRows').innerHTML = out.map(function(j,ix){
    return '<tr class="row" data-code="'+esc(j.code)+'">'+
      '<td class="mono">'+esc(j.code)+(mappedCached(j.code)?' <span class="pill p">ours</span>':'')+'</td>'+
      '<td>'+esc(j.title)+'</td><td>'+esc(j['function'])+'</td><td>'+famPill(j.level)+'</td></tr>';
  }).join('') || '<tr><td colspan="4"><div class="empty">No jobs match those filters</div></td></tr>';
  $('mCnt').innerHTML='<b>'+total.toLocaleString()+'</b> of '+MJ.length.toLocaleString()+' jobs'+(total>MAXROWS?' &middot; showing first '+MAXROWS:'');
  $('mNote').innerHTML='Survey A job library (illustrative), <b>'+MJ.length.toLocaleString()+'</b> codes. <b>ours</b> marks a job family this company maps at least one internal core to ('+Object.keys(MAPPED).length+' families). Definitions are embedded for those families only &mdash; '+Object.keys(DEFS).length.toLocaleString()+' codes. Any other job shows a note rather than a blank.';
  [].slice.call($('mRows').querySelectorAll('tr.row')).forEach(function(tr){
    tr.onclick=function(){
      [].slice.call($('mRows').querySelectorAll('tr.row')).forEach(function(x){x.classList.remove('sel');});
      tr.classList.add('sel');
      mDetail(tr.getAttribute('data-code'));
    };
  });
}
function mDetail(code){
  var j=null; for(var i=0;i<MJ.length;i++){ if(MJ[i].code===code){ j=MJ[i]; break; } }
  if(!j){ return; }
  var def=DEFS[code];
  var lvl = (D.framework||[]).filter(function(f){
    var r=String(f.radford||'').toUpperCase();
    return r===String(code.split('.')[2]||'').toUpperCase();
  });
  var back = lvl.length ? '<h4>Grades that benchmark here</h4>'+lvl.map(function(f){ return esc(f.grade)+' &middot; '+esc(f.levelDescription); }).join('<br>') : '';
  $('mDet').innerHTML='<h3>'+esc(j.title)+'</h3>'+
    '<div class="meta"><span class="mono">'+esc(j.code)+'</span> &nbsp;&middot;&nbsp; '+esc(j['function'])+' &nbsp;&middot;&nbsp; '+esc(j.area)+' &nbsp;&middot;&nbsp; '+esc(j.focus)+'</div>'+
    '<div class="body">'+(def?esc(def):'<span class="dash">Definition not embedded for this job family.</span> No internal core is mapped to it in this demonstration, so no definition is shown.')+
    back+'</div>';
}
['mSrch','mFn','mLv','mMap'].forEach(function(id){
  var el=$(id); el.oninput=mRender; el.onchange=mRender;
});
mRender();

/* ================= INTERNAL JDs ================= */
var IJ = D.mapping;
fill($('iRg'), IJ.map(function(m){return m.region;}), 'All regions');
fill($('iCat'), IJ.map(function(m){return m.category;}), 'All categories', catSort);
function iRender(){
  var q=$('iSrch').value.trim().toLowerCase(), rg=$('iRg').value, ct=$('iCat').value;
  var out=[], total=0;
  for(var i=0;i<IJ.length;i++){
    var m=IJ[i];
    if(!pass(rg,m.region)) continue;
    if(!pass(ct,m.category)) continue;
    if(q && (String(m.internalCore||'').toLowerCase().indexOf(q)<0 && String(m.newCore||'').toLowerCase().indexOf(q)<0)) continue;
    total++; if(out.length<MAXROWS) out.push({m:m,i:i});
  }
  $('iRows').innerHTML = out.map(function(o){
    var m=o.m;
    return '<tr class="row" data-ix="'+o.i+'"><td>'+esc(m.internalCore)+'</td><td>'+esc(m.newCore||'')+'</td>'+
      '<td><span class="pill">'+esc(m.category||'-')+'</span></td><td class="mono">'+esc(m.radfordCode||'')+'</td></tr>';
  }).join('') || '<tr><td colspan="4"><div class="empty">No job cores match those filters</div></td></tr>';
  $('iCnt').innerHTML='<b>'+total.toLocaleString()+'</b> of '+IJ.length.toLocaleString()+' cores'+(total>MAXROWS?' &middot; showing first '+MAXROWS:'');
  $('iNote').innerHTML='Internal job descriptions, <b>'+IJ.length.toLocaleString()+'</b> rows across two regions, every one carrying a survey code and a description.';
  [].slice.call($('iRows').querySelectorAll('tr.row')).forEach(function(tr){
    tr.onclick=function(){
      [].slice.call($('iRows').querySelectorAll('tr.row')).forEach(function(x){x.classList.remove('sel');});
      tr.classList.add('sel');
      var m=IJ[+tr.getAttribute('data-ix')];
      $('iDet').innerHTML='<h3>'+esc(m.internalCore)+'</h3>'+
        '<div class="meta">'+esc(m.region)+' &nbsp;&middot;&nbsp; '+esc(m.category||'-')+' &nbsp;&middot;&nbsp; new core: '+esc(m.newCore||'-')+' &nbsp;&middot;&nbsp; <span class="mono">'+esc(m.radfordCode||'-')+'</span></div>'+
        '<div class="body">'+(m.internalJD?esc(m.internalJD):'<span class="dash">No description on file.</span>')+'</div>';
    };
  });
}
['iSrch','iRg','iCat'].forEach(function(id){ var el=$(id); el.oninput=iRender; el.onchange=iRender; });
iRender();

/* ================= NEW ARCHITECTURE JDs ================= */
var NJ = D.newJds;
fill($('nCat'), NJ.map(function(j){return j.category;}), 'All categories', catSort);
function nRender(){
  var q=$('nSrch').value.trim().toLowerCase(), ct=$('nCat').value;
  var out=[], total=0;
  for(var i=0;i<NJ.length;i++){
    var j=NJ[i];
    if(!pass(ct,j.category)) continue;
    if(q && String(j.core||'').toLowerCase().indexOf(q)<0) continue;
    total++; if(out.length<MAXROWS) out.push({j:j,i:i});
  }
  $('nRows').innerHTML = out.map(function(o){
    return '<tr class="row" data-ix="'+o.i+'"><td>'+esc(o.j.core)+'</td><td><span class="pill">'+esc(o.j.category||'-')+'</span></td></tr>';
  }).join('') || '<tr><td colspan="2"><div class="empty">No job cores match those filters</div></td></tr>';
  $('nCnt').innerHTML='<b>'+total.toLocaleString()+'</b> of '+NJ.length.toLocaleString()+' cores'+(total>MAXROWS?' &middot; showing first '+MAXROWS:'');
  $('nNote').innerHTML='New global job architecture descriptions &mdash; <b>'+NJ.length.toLocaleString()+'</b> cores, all complete with summary, responsibilities and skills.';
  [].slice.call($('nRows').querySelectorAll('tr.row')).forEach(function(tr){
    tr.onclick=function(){
      [].slice.call($('nRows').querySelectorAll('tr.row')).forEach(function(x){x.classList.remove('sel');});
      tr.classList.add('sel');
      var j=NJ[+tr.getAttribute('data-ix')];
      $('nDet').innerHTML='<h3>'+esc(j.core)+'</h3><div class="meta">'+esc(j.category||'-')+'</div>'+
        '<div class="body"><h4>Summary</h4>'+esc(j.summary||'-')+
        '<h4>Responsibilities</h4>'+esc(j.responsibilities||'-')+
        '<h4>Skills &amp; knowledge</h4>'+esc(j.skills||'-')+'</div>';
    };
  });
}
['nSrch','nCat'].forEach(function(id){ var el=$(id); el.oninput=nRender; el.onchange=nRender; });
nRender();

/* ================= SKILL PREMIUMS ================= */
var SK = D.skills;
fill($('sCat'), SK.map(function(s){return s.category;}), 'All categories');
fill($('sSub'), SK.map(function(s){return s.subCategory;}), 'All sub-categories');
var SKMAX=0; SK.forEach(function(s){ if(+s.premium>SKMAX) SKMAX=+s.premium; });
function sRender(){
  var q=$('sSrch').value.trim().toLowerCase(), ct=$('sCat').value, sb=$('sSub').value, so=$('sSort').value;
  var out=[];
  for(var i=0;i<SK.length;i++){
    var s=SK[i];
    if(!pass(ct,s.category)) continue;
    if(!pass(sb,s.subCategory)) continue;
    if(q && String(s.skill||'').toLowerCase().indexOf(q)<0) continue;
    out.push(s);
  }
  out.sort(so==='prem' ? function(a,b){ return (+b.premium)-(+a.premium) || String(a.skill).localeCompare(String(b.skill)); }
                       : function(a,b){ return String(a.skill).localeCompare(String(b.skill)); });
  var shown=out.slice(0,MAXROWS);
  $('sRows').innerHTML = shown.map(function(s){
    var pct=Math.round(((+s.premium)-1)*1000)/10;
    var w=Math.max(4,Math.round(((+s.premium)-1)/((SKMAX-1)||1)*110));
    return '<tr><td>'+esc(String(s.skill).trim())+'</td><td><span class="pill">'+esc(s.category||'-')+'</span></td>'+
      '<td>'+esc(s.subCategory||'-')+'</td><td class="num mono">'+(+s.premium).toFixed(2)+'&times;</td>'+
      '<td><span class="bar" style="width:'+w+'px"></span><span class="mono">+'+pct.toFixed(1)+'%</span></td></tr>';
  }).join('') || '<tr><td colspan="5"><div class="empty">No skills match those filters</div></td></tr>';
  $('sCnt').innerHTML='<b>'+out.length.toLocaleString()+'</b> of '+SK.length.toLocaleString()+' skills'+(out.length>MAXROWS?' &middot; showing first '+MAXROWS:'');
  $('sNote').innerHTML='Skill and certification premiums (illustrative). The premium is a <b>multiplier on the base role rate</b>, not a standalone salary &mdash; a 1.08&times; skill adds 8% to the rate for the job it sits on. Range across the library is 1.02&times; to '+SKMAX.toFixed(2)+'&times;. The Comp Tool adds the premium on top of the market midpoint where one applies.';
}
['sSrch','sCat','sSub','sSort'].forEach(function(id){ var el=$(id); el.oninput=sRender; el.onchange=sRender; });
sRender();

/* ================= Survey B ================= */
var PJ = D.ipas;
fill($('pFn'), PJ.map(function(j){return j.majorFunction;}), 'All major functions');
function pRender(){
  var q=$('pSrch').value.trim().toLowerCase(), fn=$('pFn').value;
  var out=[], total=0;
  for(var i=0;i<PJ.length;i++){
    var j=PJ[i];
    if(!pass(fn,j.majorFunction)) continue;
    if(q && (String(j.title||'').toLowerCase().indexOf(q)<0 && String(j.code||'').toLowerCase().indexOf(q)<0)) continue;
    total++; if(out.length<MAXROWS) out.push({j:j,i:i});
  }
  $('pRows').innerHTML = out.map(function(o){
    return '<tr class="row" data-ix="'+o.i+'"><td class="mono">'+esc(o.j.code)+'</td><td>'+esc(o.j.title)+'</td>'+
      '<td>'+esc(o.j.majorFunction)+'</td><td>'+esc(o.j.subFunction||'')+'</td></tr>';
  }).join('') || '<tr><td colspan="4"><div class="empty">No jobs match those filters</div></td></tr>';
  $('pCnt').innerHTML='<b>'+total.toLocaleString()+'</b> of '+PJ.length.toLocaleString()+' jobs'+(total>MAXROWS?' &middot; showing first '+MAXROWS:'');
  $('pNote').innerHTML='Survey B catalogue (illustrative), <b>'+PJ.length.toLocaleString()+'</b> jobs. The catalogue carries <b>no job level</b>, so its jobs cannot be graded from it &mdash; the grade-to-survey benchmark comes from the level framework instead.';
  [].slice.call($('pRows').querySelectorAll('tr.row')).forEach(function(tr){
    tr.onclick=function(){
      [].slice.call($('pRows').querySelectorAll('tr.row')).forEach(function(x){x.classList.remove('sel');});
      tr.classList.add('sel');
      var j=PJ[+tr.getAttribute('data-ix')];
      $('pDet').innerHTML='<h3>'+esc(j.title)+'</h3>'+
        '<div class="meta"><span class="mono">'+esc(j.code)+'</span> &nbsp;&middot;&nbsp; '+esc(j.majorFunction)+' &nbsp;&middot;&nbsp; '+esc(j.subFunction||'-')+'</div>'+
        '<div class="body">'+(j.description?esc(j.description):'<span class="dash">No description on file.</span>')+'</div>';
    };
  });
}
['pSrch','pFn'].forEach(function(id){ var el=$(id); el.oninput=pRender; el.onchange=pRender; });
pRender();

/* ================= JD CREATOR ================= */
/* Renders the approved Word layout: header grid, then Job Summary /
   Job Responsibilities / Qualifications & Job Skills as bordered blocks.
   Summary, responsibilities and skills come from the new architecture JDs;
   the degree-and-experience line comes from the official Level Framework
   for the chosen grade, so it is never invented. */
var FW = D.framework || [];
function fwFor(grade){
  for(var i=0;i<FW.length;i++){ if(String(FW[i].grade||'').toUpperCase()===String(grade).toUpperCase()) return FW[i]; }
  return null;
}
/* grade order for the picker: E high->low, then M, P, S */
var GORDER=['E13','E12','M11','M10','M9','M8','M7','P7','P6','P5','S4','S3','S2','S1'];
(function(){
  var have={}; FW.forEach(function(f){ have[String(f.grade||'').toUpperCase()]=1; });
  var opts=GORDER.filter(function(g){ return have[g]; });
  $('jGrade').innerHTML = opts.map(function(g){
    var f=fwFor(g);
    return '<option value="'+g+'">'+g+' &middot; '+esc(f?f.levelDescription:'')+'</option>';
  }).join('');
})();
function jFillCores(){
  var q=$('jSrch').value.trim().toLowerCase();
  var list=NJ.filter(function(j){ return !q || String(j.core||'').toLowerCase().indexOf(q)>-1; });
  list.sort(function(a,b){ return String(a.core).localeCompare(String(b.core)); });
  var cap=list.slice(0,600);
  $('jCore').innerHTML = cap.map(function(j,i){
    return '<option value="'+esc(j.core)+'">'+esc(j.core)+' &middot; '+esc(j.category||'')+'</option>';
  }).join('') || '<option value="">no match</option>';
  $('jNote').innerHTML = '<b>'+list.length.toLocaleString()+'</b> of '+NJ.length.toLocaleString()+
    ' job cores available'+(list.length>600?' &middot; picker capped at 600, narrow the filter':'')+
    '. Summary, responsibilities and skills come from the new architecture JDs. The degree-and-experience line is read from the <b>official Level Framework</b> for the grade you pick &mdash; it is not invented, and if the framework has no text for that grade the line is omitted rather than guessed.';
}
function splitBullets(s){
  var t=String(s||'').trim();
  if(t===''){ return []; }
  /* the source stores bullets newline-separated; fall back to sentence split only if there are none */
  var parts = t.split(/\r?\n+/).map(function(x){ return x.replace(/^[•\-\*\s]+/,'').trim(); }).filter(function(x){ return x!==''; });
  if(parts.length>1) return parts;
  return t.split(/(?<=\.)\s+(?=[A-Z])/).map(function(x){return x.trim();}).filter(function(x){return x!=='';});
}
function jRender(){
  var core=$('jCore').value, grade=$('jGrade').value, code=$('jCode').value.trim(), flsa=$('jFlsa').value;
  var j=null; for(var i=0;i<NJ.length;i++){ if(NJ[i].core===core){ j=NJ[i]; break; } }
  if(!j){ $('jdDoc').innerHTML='<div class="empty">Pick a job core to build a description</div>'; return; }
  var f=fwFor(grade);
  var ttl = esc(j.core) + (code ? ' &ndash; ' + esc(code) : '');
  var resp = splitBullets(j.responsibilities);
  var skl  = splitBullets(j.skills);
  var summ = String(j.summary||'').split(/\r?\n+/).filter(function(x){return x.trim()!=='';});

  /* experience line, straight from the framework - omitted if absent */
  var expLine='';
  if(f){
    var bits=[];
    /* experienceTypical only. experienceRequired is calibration prose for grading
