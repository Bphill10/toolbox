.mast .kick{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8FE0BC;font-weight:700}
.mast h1{font-size:17px;font-weight:700;margin:2px 0 2px;letter-spacing:.1px}
.mast p{font-size:11.5px;color:rgba(255,255,255,.72);max-width:780px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.card h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--navy);font-weight:800;margin:0 0 3px}
.card .sub{font-size:11.5px;color:var(--mut);margin:0 0 10px;line-height:1.45}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sp{flex:1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label,.lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld input,.fld select,.inp{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;min-width:0;width:100%;height:28px}
.fld input:focus,.fld select:focus,.inp:focus{outline:2px solid rgba(15,138,95,.30);border-color:var(--blue)}
.fld .hint{font-size:10.5px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--blue);padding:0;height:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 11px;height:28px;font-weight:600;cursor:pointer;color:var(--ink);font-size:12px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#12503C;color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;height:28px}
.seg button{border:0;background:#fff;padding:0 11px;cursor:pointer;font-weight:600;color:var(--mut);border-right:1px solid var(--line);font-size:12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.03em;color:#fff;white-space:nowrap;line-height:1.5}
.chip.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:#DCFCE7;color:#166534}
.chip.warn{background:#FEF3C7;color:#92400E}
.chip.bad{background:#FEE2E2;color:#991B1B}
.chip.info{background:#D9F2EE;color:#0F5F55}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-top:2px solid var(--navy);border-radius:7px;padding:9px 12px}
.kpi b{display:block;font-size:17px;letter-spacing:-.2px;color:var(--ink);line-height:1.2}
.kpi span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:2px}
.kpi i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:3px}
.kpi.bad{border-top-color:var(--red)}.kpi.ok{border-top-color:var(--green)}.kpi.warn{border-top-color:var(--amber)}
.tbl{width:100%}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;font-weight:700}
.tbl td{padding:5px 8px;border-bottom:1px solid #EDF2EE;vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:#F7FAF8}
.tbl tr.sel td{background:#E7F6EE}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:7px}
.note{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:11.5px;color:#33463d;line-height:1.5}
.note b{color:var(--ink)}
.bar{height:6px;background:#E3EBE6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.muted{color:var(--mut)}
.small{font-size:11px}
.mono{font-family:Consolas,Menlo,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.hidden{display:none!important}
.demo-flag{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid rgba(255,255,255,.32);border-radius:999px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#cfeadc;vertical-align:middle;font-weight:600}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:10px 10px 30px}}

.paper{font-variant-numeric:lining-nums;background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px rgba(7,42,31,.12);max-width:780px;margin:10px auto 0;padding:34px 44px 40px;font-family:Georgia,"Times New Roman",serif;font-size:12.4px;line-height:1.58;color:#1b2a24}
.paper .lh{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0F8A5F;padding-bottom:12px;margin-bottom:22px}
.paper .lh b{font-size:15px;letter-spacing:.04em;color:#0B3B2C;text-transform:uppercase}
.paper .lh span{display:block;font-size:11px;letter-spacing:.14em;color:#5E6E82;text-transform:uppercase;font-family:system-ui,sans-serif}
.paper h4{margin:16px 0 4px;font-size:13px;color:#0B3B2C;font-family:system-ui,sans-serif;letter-spacing:.02em}
.paper p{margin:0 0 8px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:30px}
.paper .sig div{border-top:1px solid #1b2a24;padding-top:5px;font-size:12px;font-family:system-ui,sans-serif}
.paper .fine{margin-top:26px;font-size:10.5px;color:#7a8a84;font-family:system-ui,sans-serif;border-top:1px dashed #cfd8d3;padding-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.fact{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12px}
.fact span{color:var(--mut)}
.fact b{text-align:right}
.pbar{position:relative;height:34px;margin:10px 0 2px}
.pbar .rng{position:absolute;left:0;right:0;top:12px;height:10px;border-radius:5px;background:linear-gradient(90deg,#BFE8D3,#8AD3AE)}
.pbar .mid{position:absolute;top:6px;width:2px;height:22px;background:var(--navy)}
.pbar .im{position:absolute;top:16px;height:2px;background:#E5484D}
.pbar .mk{position:absolute;top:6px;width:14px;height:22px;margin-left:-7px;border-radius:7px;background:#0B3B2C;border:2px solid #fff;box-shadow:0 0 0 1px #0B3B2C}
.pbar .ia{position:absolute;top:11px;width:12px;height:12px;border-radius:50%;background:#E5484D;border:2px solid #fff;margin-left:-6px;box-shadow:0 0 0 1px #E5484D}
.pbar .lb{position:absolute;top:26px;font-size:10px;color:var(--mut);white-space:nowrap}
.flag{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:12px}
.steps2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.steps2 span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.fld .seg{width:100%}.fld .seg button{flex:1}
.fld .seg button[disabled]{opacity:.45;cursor:default}
@media print{
 html,body{background:#fff}
 .mast,.noprint{display:none!important}
 .wrap{padding:0;max-width:none}
 .grid{display:block!important}
 #paperCard{border:0;padding:0;box-shadow:none}
 .paper{box-shadow:none;border:0;padding:0;margin:0;max-width:none}
}
