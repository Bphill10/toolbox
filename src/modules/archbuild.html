.mast .kick{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8FE0BC;font-weight:700}
.mast h1{font-size:17px;font-weight:700;margin:2px 0 2px;letter-spacing:.1px}
.mast p{font-size:11.5px;color:rgba(255,255,255,.72);max-width:780px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.card h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--navy);font-weight:800;margin:0 0 3px}
.card .sub{font-size:11.5px;color:var(--mut);margin:0 0 10px;line-height:1.45}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sp{flex:1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label,.lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld input,.fld select,.inp{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;min-width:0;width:100%;height:28px}
.fld input:focus,.fld select:focus,.inp:focus{outline:2px solid rgba(15,138,95,.30);border-color:var(--blue)}
.fld .hint{font-size:10.5px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--blue);padding:0;height:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 11px;height:28px;font-weight:600;cursor:pointer;color:var(--ink);font-size:12px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#12503C;color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;height:28px}
.seg button{border:0;background:#fff;padding:0 11px;cursor:pointer;font-weight:600;color:var(--mut);border-right:1px solid var(--line);font-size:12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.03em;color:#fff;white-space:nowrap;line-height:1.5}
.chip.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:#DCFCE7;color:#166534}
.chip.warn{background:#FEF3C7;color:#92400E}
.chip.bad{background:#FEE2E2;color:#991B1B}
.chip.info{background:#D9F2EE;color:#0F5F55}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-top:2px solid var(--navy);border-radius:7px;padding:9px 12px}
.kpi b{display:block;font-size:17px;letter-spacing:-.2px;color:var(--ink);line-height:1.2}
.kpi span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:2px}
.kpi i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:3px}
.kpi.bad{border-top-color:var(--red)}.kpi.ok{border-top-color:var(--green)}.kpi.warn{border-top-color:var(--amber)}
.tbl{width:100%}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;font-weight:700}
.tbl td{padding:5px 8px;border-bottom:1px solid #EDF2EE;vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:#F7FAF8}
.tbl tr.sel td{background:#E7F6EE}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:7px}
.note{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:11.5px;color:#33463d;line-height:1.5}
.note b{color:var(--ink)}
.bar{height:6px;background:#E3EBE6;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.muted{color:var(--mut)}
.small{font-size:11px}
.mono{font-family:Consolas,Menlo,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.hidden{display:none!important}
.demo-flag{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid rgba(255,255,255,.32);border-radius:999px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#cfeadc;vertical-align:middle;font-weight:600}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:10px 10px 30px}}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.steps{position:sticky;top:10px;padding:10px}
.st{display:flex;gap:9px;align-items:flex-start;padding:7px 7px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.st:hover{background:var(--soft)}
.st.on{background:#E7F6EE;border-color:#A9DDC2}
.st .no{flex:none;width:20px;height:20px;border-radius:50%;background:#E6ECF4;color:var(--mut);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.st.on .no{background:var(--navy);color:#fff}
.st.done .no{background:var(--green);color:#fff}
.st b{display:block;font-size:12px}
.st span{display:block;font-size:10.5px;color:var(--mut);margin-top:1px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
.phead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.phead h2{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}
.phead p{margin:3px 0 0;color:var(--mut);font-size:12.5px;max-width:760px}
.phead .when{margin-left:auto;white-space:nowrap}
.fam{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.fam input{font-weight:700;border:0;border-bottom:1px dashed var(--line);width:100%;padding:2px 0;background:transparent}
.fam .s{font-size:11px;color:var(--mut);margin-top:4px}
.trk{display:grid;grid-template-columns:150px 1fr 1fr 90px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #EDF1F6}
.lvchips{display:flex;gap:6px;flex-wrap:wrap}
.lvchips span{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px}
.ed td[contenteditable]{outline:none}
.ed td[contenteditable]:focus{background:#FFFBEA}
.ed td{vertical-align:top;font-size:12px;line-height:1.45}
.ed th{min-width:140px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #EDF1F6}
.chk .ic{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
.chk .ic.ok{background:var(--green)}.chk .ic.warn{background:var(--amber)}.chk .ic.bad{background:var(--red)}
.gantt{display:grid;grid-template-columns:240px repeat(12,1fr) 150px;gap:0;font-size:11.5px;align-items:center}
.gantt div{padding:5px 4px;border-bottom:1px solid #EDF1F6}
.gantt .h{font-size:10px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;font-weight:700;text-align:center}
.gantt .bar2{background:var(--blue);height:12px;border-radius:4px;padding:0;margin:0 1px}
.toast{background:#DCFCE7;border:1px solid #86EFAC;color:#14532D;border-radius:8px;padding:10px 12px;margin-top:12px;font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.steps{position:static}.trk{grid-template-columns:1fr}}

}
function p5(){
  var M = mapAll(), shown = M.filter(function(m){ return ST.fil === 'all' || (ST.fil === 'review' && (m.conf !== 'c_hi' || m.flags.length)) || (ST.fil === 'acc' && ST.acc[m.r.k]); });
  var hi = M.filter(function(m){ return m.conf === 'c_hi' && !m.flags.length; }).length, accN = M.filter(function(m){ return ST.acc[m.r.k]; }).length, need = M.filter(function(m){ return m.conf !== 'c_hi' || m.flags.length; }).length;
  var h = head(4) + '<div class="row" style="margin-bottom:10px"><div class="seg">' + [['all', 'm_all'], ['review', 'm_review'], ['acc', 'm_acc']].map(function(f){ return '<button data-fl="' + f[0] + '" class="' + (ST.fil === f[0] ? 'on' : '') + '">' + T(f[1]) + '</button>'; }).join('') + '</div><button class="btn pri" id="aa">' + T('m_accall') + '</button><div class="sp"></div><span class="small muted">' + tr('m_sum', {a: accN, b: M.length, c: hi, d: need}) + '</span></div>';
  h += '<div class="scroll" style="max-height:480px"><table class="tbl"><thead><tr><th>' + T('th_job') + '</th><th>' + T('th_fam') + '</th><th>' + T('th_grade') + '</th><th>' + T('m_prop') + '</th><th class="n">' + T('b_mid') + '</th><th>' + T('m_conf') + '</th><th>' + T('m_flags') + '</th><th>' + T('m_ok') + '</th></tr></thead><tbody>';
  shown.forEach(function(m){
    var r = m.r, cls = m.conf === 'c_hi' ? 'ok' : (m.conf === 'c_md' ? 'warn' : 'bad');
    h += '<tr><td>' + esc(r.t) + ' <span class="small muted">(' + r.n + ')</span></td><td class="small">' + esc(ST.famName[famOf(r)]) + '</td><td>' + gradeChip(r.g) + ' <span class="small muted">' + esc(D.gradeBy[r.g].level) + '</span></td><td><b>' + m.l.code + '</b> <span class="small">' + esc(m.l.name) + '</span></td><td class="n">' + moneyK(r.mid) + '</td><td><span class="chip ' + cls + '">' + T(m.conf) + '</span></td><td class="small">' + m.flags.map(function(f){ return '<span class="chip warn" style="margin-right:4px">' + esc(f) + '</span>'; }).join('') + '</td><td><input type="checkbox" data-ac="' + r.k + '"' + (ST.acc[r.k] ? ' checked' : '') + '></td></tr>';
  });
  h += '</tbody></table></div>' + nav();
  $('panel').innerHTML = h;
  [].forEach.call($('panel').querySelectorAll('[data-fl]'), function(b){ b.onclick = function(){ ST.fil = b.getAttribute('data-fl'); draw(); }; });
  [].forEach.call($('panel').querySelectorAll('[data-ac]'), function(b){ b.onchange = function(){ ST.acc[b.getAttribute('data-ac')] = b.checked; draw(); }; });
  $('aa').onclick = function(){ M.forEach(function(m){ if(m.conf === 'c_hi' && !m.flags.length) ST.acc[m.r.k] = true; }); draw(); };
}
function levelRows(){
  var M = mapAll(), L = allLadders(), rows = [];
  CATORD.slice().reverse().forEach(function(c){
    L[c].slice().reverse().forEach(function(l){
      var js = M.filter(function(m){ return m.l.code === l.code; }).map(function(m){ return m.r; });
      var a = js.length ? median(js.map(function(r){ return r.sa; })) : l.mid, b = js.length ? median(js.map(function(r){ return r.sb; })) : l.mid;
      var mid = js.length ? (a + b) / 2 : l.mid;
      rows.push({l: l, jobs: js, a: a, b: b, mid: mid, rg: rangeOf(mid), none: !js.length});
    });
  });
  return rows;
}
function p6(){
  var rows = levelRows();
  rows.forEach(function(r, i){ var nxt = rows[i - 1]; r.ov = (nxt && nxt.l.cat === r.l.cat) ? pctOver(r.rg, nxt.rg) : null; });
  var h = head(5) + '<div class="row" style="margin-bottom:10px"><div class="fld" style="width:340px"><label>' + T('b_spread') + ': <b id="spv">' + ST.spread + '%</b></label><input type="range" id="sp" min="20" max="80" step="5" value="' + ST.spread + '"></div><div class="sp"></div><span class="chip ok">' + T('b_cov') + '</span></div>';
  h += '<div class="scroll" style="max-height:none"><table class="tbl"><thead><tr><th>' + T('b_lvl') + '</th><th class="n">' + T('b_jobs') + '</th><th class="n">' + T('b_a') + '</th><th class="n">' + T('b_b') + '</th><th class="n">' + T('b_mid') + '</th><th class="n">' + T('b_min') + '</th><th class="n">' + T('b_max') + '</th><th class="n">' + T('b_ov') + '</th></tr></thead><tbody>';
  rows.forEach(function(r){
    var ov = r.ov == null ? '&ndash;' : '<span class="chip ' + (r.ov >= 0.4 && r.ov <= 0.8 ? 'ok' : 'warn') + '">' + pct(r.ov) + '</span>';
    h += '<tr><td><span class="chip" style="background:' + CATCOL[r.l.cat] + '">' + r.l.code + '</span> ' + esc(r.l.name) + '</td><td class="n">' + r.jobs.length + '</td><td class="n">' + (r.none ? '<span class="muted">' + T('b_int') + '</span>' : moneyK(r.a)) + '</td><td class="n">' + (r.none ? '<span class="muted">' + T('b_int') + '</span>' : moneyK(r.b)) + '</td><td class="n"><b>' + moneyK(r.mid) + '</b></td><td class="n">' + moneyK(r.rg.lo) + '</td><td class="n">' + moneyK(r.rg.hi) + '</td><td class="n">' + ov + '</td></tr>';
  });
  h += '</tbody></table></div>';
  // range chart
  var mn = Math.min.apply(null, rows.map(function(r){ return r.rg.lo; })), mx = Math.max.apply(null, rows.map(function(r){ return r.rg.hi; })), W = 820, rh = 15, H = rows.length * rh + 24;
  function X(v){ return 60 + (Math.log(v) - Math.log(mn)) / (Math.log(mx) - Math.log(mn)) * (W - 80); }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" class="ch" style="margin-top:12px">';
  rows.forEach(function(r, i){ var y = 8 + i * rh; svg += '<text x="54" y="' + (y + 9) + '" text-anchor="end">' + r.l.code + '</text><rect x="' + X(r.rg.lo) + '" y="' + y + '" width="' + (X(r.rg.hi) - X(r.rg.lo)) + '" height="10" rx="3" fill="' + CATCOL[r.l.cat] + '" opacity=".75"/><line x1="' + X(r.mid) + '" x2="' + X(r.mid) + '" y1="' + (y - 1) + '" y2="' + (y + 11) + '" stroke="#fff" stroke-width="2"/>'; });
  svg += '</svg>';
  h += svg;
  // cost
  var L = allLadders(), mapIt = {}; mapAll().forEach(function(m){ mapIt[m.r.k] = m; });
  var below = 0, cost = 0, above = 0, rmap = {}; rows.forEach(function(r){ r.jobs.forEach(function(j){ rmap[j.k] = r; }); });
  D.people.forEach(function(p){ var rr = rmap[p.role.k]; if(!rr) return; if(p.pay < rr.rg.lo){ below++; cost += rr.rg.lo - p.pay; } else if(p.pay > rr.rg.hi) above++; });
  h += '<h2 style="margin:16px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)">' + T('b_cost') + '</h2><div class="note">' + tr('b_below', {n: num(below), c: moneyK(cost)}) + '<br>' + tr('b_above', {n: num(above)}) + '<br><span class="muted">' + T('b_note') + '</span></div>' + nav();
  $('panel').innerHTML = h;
  $('sp').oninput = function(){ ST.spread = parseInt(this.value, 10); draw(); };
}
function checks(){
  var M = mapAll(), rows = levelRows(), out = [], accN = M.filter(function(m){ return ST.acc[m.r.k]; }).length;
  out.push([accN === M.length ? 'ok' : (accN > M.length * 0.5 ? 'warn' : 'bad'), 'r_c1', accN + ' / ' + M.length]);
  var empty = rows.filter(function(r){ return r.none; }).map(function(r){ return r.l.code; });
  out.push([empty.length > rows.length * 0.25 ? 'warn' : 'ok', 'r_c2', empty.length ? empty.join(', ') : '0']);
  var badStep = CATORD.filter(function(c){ var s = stepOf(c), bd = band(c); return s > bd[1] || s < bd[0]; }).map(function(c){ return c + ' ' + pct(stepOf(c)); });
  out.push([badStep.length ? 'warn' : 'ok', 'r_c3', badStep.length ? badStep.join(', ') : 'OK']);
  var badOv = []; rows.forEach(function(r, i){ var nx = rows[i - 1]; if(nx && nx.l.cat === r.l.cat){ var o = pctOver(r.rg, nx.rg); if(o < 0.4 || o > 0.8) badOv.push(r.l.code + ' ' + pct(o)); } });
  out.push([badOv.length ? 'warn' : 'ok', 'r_c4', badOv.length ? badOv.slice(0, 6).join(', ') + (badOv.length > 6 ? ' ...' : '') : 'OK']);
  var comp = D.roles.filter(function(r){ return r.next && D.roleBy[r.next].mid < r.mid * 1.0; }).map(function(r){ return r.t + ' > ' + D.roleBy[r.next].t; });
  out.push([comp.length ? 'bad' : 'ok', 'r_c5', comp.length ? comp.join('; ') : 'OK']);
  var sing = D.roles.filter(function(r){ return r.n <= 2; }).length;
  out.push([sing > 12 ? 'warn' : 'ok', 'r_c6', String(sing)]);
  return out;
}

  $('xm').onclick = function(){
    var rows = [['Job', 'Family', 'Grade today', 'Proposed level code', 'Proposed level', 'Market midpoint (USD)', 'Match', 'Accepted', 'People']];
    mapAll().forEach(function(m){ rows.push([m.r.t, ST.famName[famOf(m.r)], m.r.g, m.l.code, m.l.name, Math.round(m.r.mid), T(m.conf), ST.acc[m.r.k] ? 'yes' : 'no', m.r.n]); });
    csvDownload('job-mapping.csv', rows);
  };
  $('xl').onclick = function(){
    var rows = [['Level code', 'Level', 'Track', 'Jobs', 'Survey A median (USD)', 'Survey B median (USD)', 'Midpoint (USD)', 'Minimum (USD)', 'Maximum (USD)']];
    levelRows().forEach(function(r){ rows.push([r.l.code, r.l.name, r.l.cat, r.jobs.length, Math.round(r.a), Math.round(r.b), Math.round(r.mid), Math.round(r.rg.lo), Math.round(r.rg.hi)]); });

}
