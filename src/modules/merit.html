.mast .kick{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8FE0BC;font-weight:700}
.mast h1{font-size:17px;font-weight:700;margin:2px 0 2px;letter-spacing:.1px}
.mast p{font-size:11.5px;color:rgba(255,255,255,.72);max-width:780px;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:14px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.card h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--navy);font-weight:800;margin:0 0 3px}
.card .sub{font-size:11.5px;color:var(--mut);margin:0 0 10px;line-height:1.45}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sp{flex:1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label,.lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:700}
.fld input,.fld select,.inp{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 8px;min-width:0;width:100%;height:28px}
.fld input:focus,.fld select:focus,.inp:focus{outline:2px solid rgba(15,138,95,.30);border-color:var(--blue)}
.fld .hint{font-size:10.5px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--blue);padding:0;height:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 11px;height:28px;font-weight:600;cursor:pointer;color:var(--ink);font-size:12px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:#12503C;color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;height:28px}
.seg button{border:0;background:#fff;padding:0 11px;cursor:pointer;font-weight:600;color:var(--mut);border-right:1px solid var(--line);font-size:12px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.03em;color:#fff;white-space:nowrap;line-height:1.5}
.chip.soft{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:#DCFCE7;color:#166534}
.chip.warn{background:#FEF3C7;color:#92400E}
.chip.bad{background:#FEE2E2;color:#991B1B}
.chip.info{background:#D9F2EE;color:#0F5F55}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-top:2px solid var(--navy);border-radius:7px;padding:9px 12px}
.kpi b{display:block;font-size:17px;letter-spacing:-.2px;color:var(--ink);line-height:1.2}
.kpi span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:2px}
.kpi i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:3px}
.kpi.bad{border-top-color:var(--red)}.kpi.ok{border-top-color:var(--green)}.kpi.warn{border-top-color:var(--amber)}
.tbl{width:100%}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0;font-weight:700}
.tbl td{padding:5px 8px;border-bottom:1px solid #EDF2EE;vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:#F7FAF8}
.tbl tr.sel td{background:#E7F6EE}
.scroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:7px}
.note{background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:11.5px;color:#33463d;line-height:1.5}
.note b{color:var(--ink)}

    var t = e.target, a;
    if((a = t.getAttribute('data-bud'))){ S.bud[a] = Math.max(0, parseFloat(t.value) || 0); refresh(); }
    else if((a = t.getAttribute('data-hbud'))){ S.hbud[a] = Math.max(0, parseFloat(t.value) || 0); refresh(); }
    else if((a = t.getAttribute('data-m'))){ var ix = a.split(','); S.M[+ix[0]][+ix[1]] = Math.max(0, parseFloat(t.value) || 0); tint(); refresh(); }
    else if(t.id === 'eff'){ if(/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ S.eff = t.value; refresh(); } }
    else if(t.id === 'promo'){ S.promo = Math.max(0, parseFloat(t.value) || 0); refresh(); }
    else if(t.id === 'promoInc'){ S.promoInc = Math.max(0.5, parseFloat(t.value) || 8); refresh(); }
    else if(t.id === 'market'){ S.market = Math.max(0, parseFloat(t.value) || 0); refresh(); }
    else if(t.id === 'minM'){ S.minM = Math.max(0, parseFloat(t.value) || 0); cleanAfter(); }
    else if(t.id === 'cap'){ S.cap = Math.max(0.5, parseFloat(t.value) || 8); refresh(); }
    else if(t.id === 'multIn'){ var v = parseFloat(t.value); if(isFinite(v) && v >= 0){ CT.forEach(function(c){ S.mult[c] = v; }); S.keep = false; $('keep').checked = false; refresh(); } }
    else if(t.id === 'fq'){ S.q = t.value.trim(); S.page = 0; renderPlan(); }
    else if(t.id === 'fm'){ S.fm = t.value.trim(); S.page = 0; renderPlan(); }
  });
  document.addEventListener('change', function(e){
    var t = e.target, a;
    if(t.id === 'hrOn'){ S.hrOn = t.checked; $('budTbl').className = 'tbl bt' + (S.hrOn ? '' : ' nohr'); $('thB').textContent = S.hrOn ? 'Salaried budget %' : 'Merit budget %'; refresh(); }
    else if(t.id === 'minR'){ S.minR = +t.value; cleanAfter(); }
    else if(t.id === 'spread'){ S.spread = +t.value; refresh(); }
    else if(t.id === 'proHire'){ S.proHire = t.checked; refresh(); }
    else if(t.id === 'proFte'){ S.proFte = t.checked; refresh(); }
    else if(t.id === 'lump'){ S.lump = t.checked; refresh(); }
    else if(t.id === 'byC'){ S.byC = t.checked; if(S.keep){ refresh(); } }
    else if(t.id === 'keep'){ S.keep = t.checked; refresh(); }
    else if(t.id === 'fc'){ S.fc = t.value; S.page = 0; renderPlan(); }
    else if(t.id === 'fs'){ S.fs = t.value; S.page = 0; renderPlan(); }
    else if(t.id === 'fb'){ S.fb = t.value; S.page = 0; renderPlan(); }
    else if(t.id === 'fe'){ S.fe = t.value; S.page = 0; renderPlan(); }
    else if(t.id === 'ff'){ S.ff = t.value; S.page = 0; renderPlan(); }
    else if(t.id === 'mgrSort'){ mgrSort = t.value; renderRoll(); }
    else if(t.id === 'mgrMin'){ mgrMin = +t.value; renderRoll(); }
    else if((a = t.getAttribute('data-ov'))){
      var r = PS[+a], v = parseFloat(t.value);
      if(!isFinite(v) || v < 0 || Math.abs(v - r.matched) < 0.005) delete S.ov[a]; else S.ov[a] = v;
      refresh();
    }
  });
  document.addEventListener('click', function(e){
    var t = e.target, el;
    if((el = t.closest('[data-sk]'))){ var k = el.getAttribute('data-sk'); S.sort = [k, S.sort[0] === k ? -S.sort[1] : ((k === 'name' || k === 'mgr' || k === 'role' || k === 'site') ? 1 : -1)]; renderPlan(); return; }
    if((el = t.closest('[data-r]'))){ delete S.ov[el.getAttribute('data-r')]; refresh(); return; }
    if((el = t.closest('[data-pg]'))){ var g = el.getAttribute('data-pg'), pages = Math.max(1, Math.ceil(filtered().length / PAGE)); S.page = g === 'first' ? 0 : g === 'prev' ? S.page - 1 : g === 'next' ? S.page + 1 : pages - 1; renderPlan(); $('secPlan').scrollIntoView({block: 'start'}); return; }
    if((el = t.closest('tr[data-site]'))){ S.fs = el.getAttribute('data-site'); S.fm = ''; $('fs').value = S.fs; $('fm').value = ''; S.page = 0; renderPlan(); $('secPlan').scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
    if((el = t.closest('tr[data-mgr]'))){ S.fm = el.getAttribute('data-mgr'); S.fs = 'all'; $('fm').value = S.fm; $('fs').value = 'all'; S.page = 0; renderPlan(); $('secPlan').scrollIntoView({behavior: 'smooth', block: 'start'}); return; }
  });
  $('fitBtn').onclick = function(){ prep(); solveMult(); refresh(); };
  $('mult1').onclick = function(){ CT.forEach(function(c){ S.mult[c] = 1; }); S.keep = false; $('keep').checked = false; refresh(); };
  $('bReset').onclick = function(){ S.ov = {}; refresh(); };
  $('bPrint').onclick = function(){ try{ window.print(); }catch(e){} };
  $('bDown').onclick = exportCsv;
}
function cleanAfter(){ prep(); cleanOv(); refresh(); }

/* ---------- export ---------- */
function exportCsv(){
  var cu = function(c){ return cur2(c); };
  var out = [['Employee', 'Role', 'Grade', 'Country', 'Site', 'Manager', 'Pay type', 'FTE', 'Tenure (years)', 'Rating (5-point)', 'Rating (rounded)', 'Market midpoint (USD)', 'Compa-ratio', 'Range minimum (USD)', 'Range maximum (USD)',
   'Eligible', 'Reason not eligible', 'Currency', 'Current pay (local, hourly rate or annual)', 'Pay unit', 'Current annual pay (USD, full-time)', 'Matrix cell %', 'Multiplier', 'Pro-rata factor', 'Matrix % applied', 'Proposed %', 'Edited by hand', 'Lump sum',
   'New pay (local, hourly rate or annual)', 'Increase (local, cents per hour for hourly)', 'Increase annual (local)', 'Cost (USD)', 'New compa-ratio', 'Flags', 'Last cycle % (July 2026)', 'Effective date']];
  PS.forEach(function(r){
    var p = r.p, el = r.elig, c = p.country, cur = cu(c), rate = r.rate, lo = r.mid * (1 - S.spread / 100), hi = r.mid * (1 + S.spread / 100);
    out.push([p.name, p.role.t, p.role.g, ctyName(c), r.site, r.mgr, p.hourly ? 'Hourly' : 'Salaried', p.fte.toFixed(2), p.ten.toFixed(1), p.rating.toFixed(1), r.rr, Math.round(r.mid), r.compa.toFixed(3), Math.round(lo), Math.round(hi),
     el ? 'Yes' : 'No', r.why, cur, p.hourly ? rate.toFixed(2) : Math.round(p.loc), p.hourly ? 'per hour' : 'per year', Math.round(p.pay), r.cell.toFixed(2), S.mult[c].toFixed(3), r.pf.toFixed(3), el ? r.matched.toFixed(2) : '', el ? r.pct.toFixed(2) : '', el ? (r.has ? 'Yes' : 'No') : '', el ? (r.lump ? 'Yes' : 'No') : '',
     el ? (p.hourly ? (rate * (1 + r.k)).toFixed(2) : Math.round(p.loc * (1 + r.k))) : '', el ? (p.hourly ? Math.round(rate * r.k * 100) : Math.round(p.loc * r.k)) : '', el ? Math.round(p.loc * r.pct / 100) : '', el ? r.cost.toFixed(2) : '', el ? r.newCompa.toFixed(3) : '',
     r.fl.map(function(f){ return FL[f][0]; }).join('; '), p.merit ? p.merit.toFixed(1) : '', S.eff]);
  });
  csvDownload('merit-plan-' + S.eff + '.csv', out);
}

/* ---------- boot ---------- */
function boot(){
  prep(); solveMult();
  buildBudget(); buildRules(); buildMatrix(); buildFit(); buildPlanShell();
  wire(); refresh();
}
boot();
