<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Chart · MGI Insight</title>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root { --deep:#072A1F; --green:#0B4A36; --accent:#0F8A5F; --ink:#16241e; --muted:#5C6F66; --line:#DDE6E0; --soft:#F2F7F4; --bg:#F5F7F6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14.5px/1.45 "Segoe UI", Arial, Helvetica, sans-serif; }
  header { background:linear-gradient(135deg,var(--deep),var(--green)); color:#fff; padding:20px 16px 22px; }
  .w { max-width:1200px; margin:0 auto; }
  header a { color:#9BE7C4; text-decoration:none; font-size:13px; font-weight:600; }
  .k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#9BE7C4; font-weight:800; margin-top:10px; }
  h1 { font:600 27px/1.2 Georgia, serif; margin:4px 0 6px; }
  header p { margin:0; color:#cfe9dd; max-width:820px; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0 4px; }
  .search { position:relative; flex:1; min-width:240px; max-width:420px; }
  .search input { width:100%; font:14px "Segoe UI", Arial; padding:9px 12px; border:1px solid var(--line); border-radius:9px; }
  .hits { position:absolute; z-index:5; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:9px; margin-top:4px; max-height:300px; overflow:auto; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .hits div { padding:7px 12px; cursor:pointer; } .hits div:hover { background:var(--soft); }
  .hits span { color:var(--muted); font-size:12px; }
  .stat { color:var(--muted); font-size:13px; }
  .crumbs { margin:12px 0; font-size:13px; color:var(--muted); }
  .crumbs a { color:var(--green); cursor:pointer; text-decoration:none; font-weight:600; }
  .tree { display:flex; flex-direction:column; align-items:center; padding:10px 0 40px; }
  .node { background:#fff; border:1px solid var(--line); border-top:4px solid var(--c, var(--green)); border-radius:12px; padding:10px 12px; width:220px; cursor:pointer; transition:box-shadow .15s, transform .15s; }
  .node:hover { box-shadow:0 6px 18px rgba(7,42,31,.12); transform:translateY(-1px); }
  .node.top { width:290px; cursor:default; box-shadow:0 4px 16px rgba(7,42,31,.12); }
  .av { width:34px; height:34px; border-radius:50%; background:var(--c, var(--green)); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; float:left; margin-right:9px; }
  .nm { font-weight:700; line-height:1.25; }
  .tt { color:var(--muted); font-size:12.5px; line-height:1.3; }
  .ft { clear:both; display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; }
  .ft b { color:var(--ink); }
  .up { margin-bottom:8px; }
  .vline { width:2px; height:22px; background:#c9d8cf; }
  .kids { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; position:relative; padding-top:22px; border-top:2px solid #c9d8cf; max-width:100%; }
  .more { color:var(--muted); font-size:13px; margin-top:12px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
  @media (max-width:600px) { .node, .node.top { width:100%; } .kids { border-top:0; padding-top:10px; } }
</style>
</head>
<body>
<header><div class="w">
  <a href="/" target="_top">&larr; Back to MGI Insight</a>
  <div class="k">Step 2 · Job architecture and careers</div>
  <h1>Org chart</h1>
  <p>Every active employee and who they report to. Click a person to move down; use the path to move back up, or search for anyone.</p>
</div></header>
<div class="w" style="padding:0 16px">
  <div class="tools"><div class="search"><input id="q" placeholder="Search by name or job title" autocomplete="off"><div class="hits" id="hits" hidden></div></div><span class="stat" id="stat"></span></div>
  <div class="legend" id="legend"></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="tree" id="tree"></div>
</div>
<script>
const WF = {{include:data/workforce.json}};
</script>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = { 'GREENHOUSE OPERATIONS':'#0F8A5F', 'PACKING AND DISTRIBUTION':'#B45309', 'MAINTENANCE AND ENGINEERING':'#0E7490', 'QUALITY AND FOOD SAFETY':'#7C3AED', 'SALES AND MARKETING':'#DB2777', 'SUPPLY CHAIN AND LOGISTICS':'#65A30D', 'CORPORATE FUNCTIONS':'#0B4A36' };
const famOf = {}; WF.jobs.forEach(j => famOf[j.k] = j.tw);
const tc = s => s.toLowerCase().replace(/(^|[\s\-'])\p{L}/gu, m => m.toUpperCase());
const P = WF.org.map(([n, t, loc, sup, k], i) => { const [last, first] = n.split(', '); return { i, name: tc((first || '') + ' ' + last).trim(), init: ((first||' ')[0] + last[0]).toUpperCase(), t, loc, sup, k, kids: [] }; });
P.forEach(p => { if (p.sup >= 0 && P[p.sup]) P[p.sup].kids.push(p); });
const size = p => p._s != null ? p._s : (p._s = p.kids.reduce((s, k) => s + 1 + size(k), 0));
P.forEach(p => p.kids.sort((a, b) => size(b) - size(a) || a.name.localeCompare(b.name)));
const root = P.find(p => p.sup < 0) || P[0];
size(root);
const color = p => COLORS[famOf[p.k]] || '#0B4A36';

function card(p, top){
  return '<div class="node'+(top?' top':'')+'" data-i="'+p.i+'" style="--c:'+color(p)+'"><div class="av">'+esc(p.init)+'</div><div class="nm">'+esc(p.name)+'</div><div class="tt">'+esc(p.t)+'</div><div class="tt">'+esc(p.loc)+'</div>'
    + '<div class="ft"><span><b>'+p.kids.length+'</b> direct</span><span><b>'+size(p).toLocaleString()+'</b> in team</span></div></div>';
}
let cur = root;
function show(p){
  cur = p;
  const path = []; for (let x = p; x; x = x.sup >= 0 ? P[x.sup] : null) path.unshift(x);
  $('#crumbs').innerHTML = path.map((x, k) => k === path.length - 1 ? '<b>'+esc(x.name)+'</b>' : '<a data-i="'+x.i+'">'+esc(x.name)+'</a>').join(' › ');
  const kids = p.kids.slice(0, 60);
  $('#tree').innerHTML = (p.sup >= 0 ? '<div class="up">'+card(P[p.sup])+'</div><div class="vline"></div>' : '')
    + card(p, true)
    + (kids.length ? '<div class="vline"></div><div class="kids">'+kids.map(k => card(k)).join('')+'</div>' : '<p class="more">No direct reports.</p>')
    + (p.kids.length > 60 ? '<p class="more">Showing 60 of '+p.kids.length+' direct reports. Search to find anyone.</p>' : '');
  document.querySelectorAll('[data-i]').forEach(el => el.onclick = () => show(P[+el.dataset.i]));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#q').oninput = () => {
  const q = $('#q').value.trim().toLowerCase();
  if (q.length < 2) { $('#hits').hidden = true; return; }
  const hits = P.filter(p => p.name.toLowerCase().includes(q) || p.t.toLowerCase().includes(q)).sort((a,b) => size(b) - size(a)).slice(0, 25);
  $('#hits').innerHTML = hits.map(p => '<div data-h="'+p.i+'">'+esc(p.name)+' <span>· '+esc(p.t)+', '+esc(p.loc)+'</span></div>').join('') || '<div><span>No one found</span></div>';
  $('#hits').hidden = false;
  $('#hits').querySelectorAll('[data-h]').forEach(el => el.onclick = () => { $('#hits').hidden = true; $('#q').value = ''; show(P[+el.dataset.h]); });
};
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#hits').hidden = true; });
const managers = P.filter(p => p.kids.length).length;
const spans = P.filter(p => p.kids.length).map(p => p.kids.length);
$('#stat').textContent = P.length.toLocaleString() + ' people · ' + managers + ' managers · average span of control ' + (spans.reduce((a,b) => a+b, 0) / spans.length).toFixed(1);
$('#legend').innerHTML = Object.entries(COLORS).map(([k, c]) => '<span><i style="background:'+c+'"></i>'+k.charAt(0)+k.slice(1).toLowerCase()+'</span>').join('');
if (window.top !== window) document.querySelector('header a').style.display = 'none';
show(root);
})();
</script>
</body>
</html>
